theme = "catppuccin_mocha"

[editor]
true-color = true
cursorline = true
bufferline = "multiple"
color-modes = true
end-of-line-diagnostics = "hint"

[editor.lsp]
display-messages = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "total-line-numbers", "file-type"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "┊"

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
C-q = ":buffer-close"
S-right = "jump_view_right"
S-left = "jump_view_left"
S-up = "jump_view_up"
S-down = "jump_view_down"
C-y = [
  ':sh rm -f /tmp/yazi-tmp-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/yazi-tmp-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/yazi-tmp-file}',
  ':redraw',
]
"ù" = "@["
"$" = "@]"

# custom mode to put all my stuff
[keys.normal."="]
b = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
y = ":sh echo %{buffer_name} | pbcopy"
